name: Test - Generate Audio

on:
  workflow_dispatch:
    inputs:
      match_id:
        description: "شناسه‌ی بازی"
        required: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Generate audio
        working-directory: scripts
        env:
          HIGHLIGHTLY_API_KEY: ${{ secrets.HIGHLIGHTLY_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python generate_audio.py "${{ github.event.inputs.match_id }}"
      - name: Upload audio as artifact
        uses: actions/upload-artifact@v4
        with:
          name: episode-audio
          path: |
            scripts/episode.wav
            scripts/dialogue.json

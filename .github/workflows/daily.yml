name: Daily Pipeline

on:
  schedule:
    - cron: "30 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run daily pipeline
        working-directory: scripts
        env:
          HIGHLIGHTLY_API_KEY: ${{ secrets.HIGHLIGHTLY_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python main.py
      - name: Upload episode outputs
        uses: actions/upload-artifact@v4
        with:
          name: daily-episodes
          path: scripts/output/
      - name: Commit updated processed-matches state
        run: |
          git config user.name "moj-football-bot"
          git config user.email "actions@github.com"
          git add data/processed_matches.json
          git diff --cached --quiet || git commit -m "Update processed matches"
          git push
